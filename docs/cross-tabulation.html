<html>

    <link rel="stylesheet" href="/assets/crosstab_style/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>

  <body>
    <div id="crosstab-page">
      <div id="crosstab-app">
  <div class="container fluid-container">
    <div class="header-section">
      <h1 class="page-title">Cross Tabulation Tool</h1>
      <p class="page-subtitle">Upload your survey datasets and dynamically generate cross-tabulation tables.</p>
    </div>
    
    <div class="card">
      <div class="card-header">
        <h2>Upload Excel File</h2>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label for="fileInput">Upload an Excel File (.xlsx)</label>
          <div class="file-upload-dropzone">
            <svg class="upload-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span class="upload-text"><strong>Click to upload</strong> or drag and drop</span>
            <span class="upload-subtext">Excel files (.xlsx) only</span>
            <input type="file" id="fileInput" accept=".xlsx" class="form-control-file">
          </div>
          <small class="form-text text-muted mt-2">Select an Excel file with your survey data</small>
        </div>
        
        <div class="options-grid">
          <div class="form-check custom-checkbox">
            <input type="checkbox" id="mergedHeader" class="form-check-input">
            <label for="mergedHeader" class="form-check-label">Merged Question Header</label>
          </div>
          
          <div class="form-check custom-checkbox">
            <input type="checkbox" id="showPercentage" class="form-check-input">
            <label for="showPercentage" class="form-check-label">Calculate Percentage</label>
          </div>
        </div>
        
        <div class="form-group mt-3 percentage-box" id="percentageTypeGroup" style="display: none;">
          <label class="mb-2">Percentage Base:</label>
          <div class="radio-group">
            <div class="form-check form-check-inline">
              <input type="radio" name="percentageType" id="colPercentage" value="column" checked class="form-check-input">
              <label for="colPercentage" class="form-check-label">Column Percentage</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" name="percentageType" id="rowPercentage" value="row" class="form-check-input">
              <label for="rowPercentage" class="form-check-label">Row Percentage</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" name="percentageType" id="tablePercentage" value="table" class="form-check-input">
              <label for="tablePercentage" class="form-check-label">Table Percentage</label>
            </div>
          </div>
        </div>
        
        <button id="loadFileBtn" class="btn btn-primary mt-3" disabled>Load File</button>
      </div>
    </div>
    
    <div id="questionSelector" class="card mt-4" style="display: none;">
      <div class="card-header">
        <h2>Select Questions</h2>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label for="questionSelect">Append Question(s)</label>
          <select id="questionSelect" multiple class="form-control" style="height: 200px;"></select>
        </div>
        <button id="computeBtn" class="btn btn-primary">Compute Questions</button>
      </div>
    </div>
    
    <div id="results" class="card mt-4" style="display: none;">
      <div class="card-header results-card-header">
        <h2>Generated Tables</h2>
        <button id="exportBtn" class="btn btn-success">Export All Tables</button>
      </div>
      
      <div class="results-body">
        <div class="table-scroll-container" id="tableScrollContainer">
          <div id="tableWrapper"></div>
        </div>
      </div>
      
      <div class="sticky-scrollbar" id="stickyScrollbar">
        <div class="sticky-scrollbar-inner" id="stickyScrollbarInner"></div>
      </div>
    </div>
    
    <div id="loading" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.getElementById("tableScrollContainer");
    const stickyBar = document.getElementById("stickyScrollbar");
    const stickyInner = document.getElementById("stickyScrollbarInner");
    const tableWrapper = document.getElementById("tableWrapper");

    function syncScrollbars() {
      if (!container || !stickyBar || !stickyInner) return;
      
      const contentWidth = tableWrapper.scrollWidth;
      stickyInner.style.width = contentWidth + "px";
      
      if (contentWidth > container.clientWidth) {
        stickyBar.style.display = "block";
      } else {
        stickyBar.style.display = "none";
      }
    }

    if (container && stickyBar) {
      stickyBar.addEventListener("scroll", () => {
        container.scrollLeft = stickyBar.scrollLeft;
      });
      container.addEventListener("scroll", () => {
        stickyBar.scrollLeft = container.scrollLeft;
      });
    }

    const observer = new MutationObserver(syncScrollbars);
    if (tableWrapper) {
      observer.observe(tableWrapper, { childList: true, subtree: true, characterData: true });
    }
    window.addEventListener("resize", syncScrollbars);

    const fileInput = document.getElementById("fileInput");
    if (fileInput) {
      fileInput.addEventListener("change", (e) => {
        const dropzone = e.target.closest(".file-upload-dropzone");
        if (dropzone && e.target.files.length > 0) {
          const textSpan = dropzone.querySelector(".upload-text");
          if (textSpan) textSpan.innerHTML = `Selected: <strong>${e.target.files[0].name}</strong>`;
        }
      });
    }
  });
</script>
    </div>
    
    <script src="/assets/crosstab_style/crosstab.js"></script>
  </body>
</html>
